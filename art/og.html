<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:#140a28}
.shot{position:absolute;inset:0;background:url(shot.png) 62% 78%/128% no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,10,40,.97) 0%,rgba(20,10,40,.86) 38%,rgba(20,10,40,.15) 66%,transparent 100%)}
.txt{position:absolute;left:58px;top:46px;width:640px}
h1{margin:0;font-size:132px;line-height:.86;font-weight:900;font-style:italic;letter-spacing:1px}
h1 .a{color:#ffd23f;text-shadow:0 8px 0 #b31e5a}
h1 .b{color:#ff3d7f;text-shadow:0 8px 0 #1a1060}
p{margin:26px 0 0;font-size:30px;font-weight:700;line-height:1.3}
.chips{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:19px;font-weight:900;letter-spacing:1px;padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.cta{display:inline-block;margin-top:22px;background:#ff3d7f;color:#fff;font-weight:900;font-style:italic;font-size:30px;padding:14px 34px;border-radius:18px;box-shadow:0 7px 0 #8a1540}
.roster{position:absolute;right:26px;bottom:18px;display:flex;gap:0}
.roster img{width:118px;margin-left:-26px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
</style></head><body>
<div class="shot"></div><div class="shade"></div>
<div class="txt">
  <h1><span class="a">BONK</span><br><span class="b">BRAWL</span></h1>
  <p>Knock your friends off the stage.</p>
  <div class="chips"><span class="chip">4-PLAYER ONLINE</span><span class="chip">ROLLBACK NETCODE</span><span class="chip">10 FIGHTERS</span><span class="chip">WEAPONS</span></div>
  <div class="cta">FIGHT FREE &#8594;</div>
</div>
<div class="roster"><img src="p/character-orc.png"><img src="p/character-vampire.png"><img src="p/character-male-e.png"><img src="p/character-ghost.png"><img src="p/character-human.png"></div>
</body></html>
